name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build contracts
        run: forge build --deny warnings

      - name: Solidity tests
        run: forge test -vv

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Includes the on-chain tests, which start their own Anvil node and cross-check the Python
      # and Solidity Merkle implementations against each other.
      - name: Python tests
        run: python -m pytest -q

  reproducibility:
    name: gas numbers are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          forge build

      # The claim in the README is that gas is deterministic, so re-measuring has to reproduce the
      # committed tables exactly. This job is what stops that claim from going stale.
      - name: Re-measure gas and diff against the committed tables
        run: |
          python benchmarks/measure_gas.py
          git diff --exit-code -- results/tables/gas_per_operation.csv results/tables/verification_gas.csv
